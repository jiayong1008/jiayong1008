name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: rickstaa/github-readme-stats-action@main
        with:
          card: stats
          options: username=jiayong1008&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&theme=default&hide_rank=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top languages card
        uses: rickstaa/github-readme-stats-action@main
        with:
          card: top-langs
          options: username=jiayong1008&layout=compact&hide_border=true&theme=default
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update WakaTime table in README
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: node scripts/update-wakatime-readme.mjs

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git commit -m "chore: update stats cards" || exit 0
          git push
